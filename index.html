<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CoffeeFlow</title>
</head>

<body style="margin:0; background-color:#F8F5F0;">
  <div id="root">
    <style>
      @media (prefers-color-scheme: dark) {
        body { background-color: #171310 !important; }
        .cf-pre-bg { background-color: #171310 !important; }
        .cf-pre-title { color: #FAF8F5 !important; }
        .cf-pre-logo, .cf-pre-tagline { color: #DCBEA9 !important; }
      }
      .cf-pre-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        min-height: 100vh;
        height: 100vh;
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        padding: 2rem;
        box-sizing: border-box;
        background-color: #F8F5F0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .cf-pre-logo {
        width: 11rem;
        height: 11rem;
        color: #6B4430;
      }
      .cf-pre-bar {
        width: 12rem;
        height: 4px;
        background-color: rgba(107, 68, 48, 0.15);
        border-radius: 9999px;
        overflow: hidden;
      }
      .cf-pre-bar-fill {
        width: 40%;
        height: 100%;
        background-color: #6B4430;
        border-radius: 9999px;
        animation: cf-pre-pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes cf-pre-pulse {
        0% { transform: translateX(-50%); width: 30%; }
        100% { transform: translateX(250%); width: 50%; }
      }
    </style>
    <div class="cf-pre-splash cf-pre-bg">
      <div style="flex: 1;"></div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <svg class="cf-pre-logo" fill="none" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(256, 256) scale(0.84) translate(-524, -382)">
            <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
              <polygon points="309,170 691,170 573,406 427,406" stroke-width="22"></polygon>
              <line x1="454.9" y1="170" x2="482.8" y2="406" stroke-width="17"></line>
              <line x1="500" y1="170" x2="500" y2="406" stroke-width="17"></line>
              <line x1="545.1" y1="170" x2="517.2" y2="406" stroke-width="17"></line>
              <path d="M676 208 H726 A56 56 0 0 1 726 320 H616" stroke-width="22"></path>
            </g>
            <polygon points="427,424 573,424 545,480 455,480" fill="currentColor" stroke="currentColor" stroke-width="8" stroke-linejoin="round"></polygon>
            <path d="M500 514 C512 532 528 552 528 576 A28 28 0 0 1 472 576 C472 552 488 532 500 514 Z" fill="currentColor"></path>
          </g>
        </svg>
        <h1 class="cf-pre-title" style="margin: 0.5rem 0 0; font-size: 1.875rem; font-weight: 700; color: #1F1A17; letter-spacing: -0.025em;">
          CoffeeFlow
        </h1>
        <p class="cf-pre-tagline" style="margin: 0.25rem 0 0; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; color: #6B4430; text-transform: uppercase;">
          Brew Perfection
        </p>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 100%; padding-bottom: 2.5rem; gap: 1.5rem;">
        <div class="cf-pre-bar">
          <div class="cf-pre-bar-fill"></div>
        </div>
        <div style="font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.05em; color: rgba(111, 78, 55, 0.6); text-transform: uppercase;">
          A Kulino Tech Project
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
