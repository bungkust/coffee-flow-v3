<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">CoffeeFlow – Brew Perfection</title>
  <!--
    Golden ratio (φ = 1.618) dipakai di:
    - Cone: lebar atas 382 : tinggi 236 = φ ; lebar bawah 146 = 236 / φ
    - Base 90 = 146 / φ ; tinggi base 56 = 90 / φ ; tetes 90 x 56
    - Slat di posisi 0.382 / 0.5 / 0.618 dari lebar cone
    - Ukuran teks: tagline = wordmark / φ^3
    - Margin atas : bawah = 1 : φ
  -->
  <rect width="1000" height="1000" fill="#F8F5F0"/>

  <g transform="translate(0,-26)">
    <!-- Dripper -->
    <g fill="none" stroke="#6B4430" stroke-linejoin="round" stroke-linecap="round">
      <!-- cone -->
      <polygon points="309,170 691,170 573,406 427,406" stroke-width="20"/>
      <!-- slat (0.382 / 0.5 / 0.618) -->
      <line x1="454.9" y1="170" x2="482.8" y2="406" stroke-width="16"/>
      <line x1="500" y1="170" x2="500" y2="406" stroke-width="16"/>
      <line x1="545.1" y1="170" x2="517.2" y2="406" stroke-width="16"/>
      <!-- handle -->
      <path d="M676 208 H726 A56 56 0 0 1 726 320 H616" stroke-width="20"/>
    </g>

    <!-- Base -->
    <polygon points="427,424 573,424 545,480 455,480" fill="#6B4430" stroke="#6B4430" stroke-width="8" stroke-linejoin="round"/>

    <!-- Tetes -->
    <path d="M500 514 C512 532 528 552 528 576 A28 28 0 0 1 472 576 C472 552 488 532 500 514 Z" fill="#6B4430"/>

    <!-- Wordmark -->
    <text x="500" y="753" text-anchor="middle"
          font-family="'Poppins','Montserrat','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="130" font-weight="700" letter-spacing="-2" fill="#1F1A17">CoffeeFlow</text>

    <!-- Tagline -->
    <text x="505" y="809" text-anchor="middle"
          font-family="'Poppins','Montserrat','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="31" font-weight="600" letter-spacing="9.3" fill="#6B4430">BREW PERFECTION</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
